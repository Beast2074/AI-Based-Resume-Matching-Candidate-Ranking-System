[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-matching-backend"
version = "0.1.0"
description = "AI-Based Resume Matching & Candidate Ranking System Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.18",
    "pymupdf>=1.24.0,<2.0.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "fastembed>=0.2.7",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "faker>=24.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["models*", "tests*"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
